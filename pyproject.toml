[project]
name = "quant-pipeline"
version = "0.1.0"
description = "A股量化数据自动化抓取管道"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "textual>=0.50.0",
    "rich>=13.0.0",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
# 需要先安装系统级 C 库: brew install ta-lib
# 然后运行: uv pip install ta-lib --index-url https://pypi.tuna.tsinghua.edu.cn/simple/
talib = [
    "ta-lib>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"daily_pipeline.py" = ["E402"]
"reconcile_with_akshare.py" = ["E402"]
"__init__.py" = ["N999"]

[tool.mypy]
# 全仓 mypy 门禁（CI 里直接跑 `uv run mypy`，范围由 files 决定）。
#
# explicit_package_bases + mypy_path：providers.py 顶层 import smartmoney_hunter
# （只装在 quant_hunter venv），项目根必须参与模块名解析，否则 mypy 会以
# "source file found twice under different module names" 直接退出、一行都不检查。
#
# files 覆盖生产代码与 tests/：全仓门禁，任何一处类型错误都会让 CI 变红。
# （tests/ 曾有 34 个错误，集中在夹具的 **dict[str, object] 解包、Mock 属性访问、
#   以及测试替身与 Protocol/具体类的签名不兼容，已逐项修完。）
explicit_package_bases = true
mypy_path = "."
warn_unused_ignores = true
files = [
    "core",
    "tasks",
    "tui",
    "scripts",
    "tests",
    "daily_pipeline.py",
    "interface.py",
    "providers.py",
]

# 以下依赖没有 stub / py.typed，对其 import 做检查没有意义。逐个模块豁免，
# 而不是全局 ignore_missing_imports = true，以免把自有代码的 import 错误一并吞掉。
# 裸名与 ``.*`` 需分开写：mypy 的 ``pkg.*`` 不匹配 ``pkg`` 自身。
[[tool.mypy.overrides]]
module = [
    "akshare",
    "akshare.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "yfinance",
    "yfinance.*",
    "curl_cffi",
    "curl_cffi.*",
    "smartmoney_hunter",
    "smartmoney_hunter.*",
    "tradingagents",
    "tradingagents.*",
    # 平台条件依赖：CI 是 Ubuntu，本地开发机是 macOS，同一条 import 的
    # 解析结果不同，会让门禁结果随操作系统翻转。
    # py-mini-racer 是 akshare 的 Linux 专属传递依赖，uv.lock 锁在 0.6.0
    # （无 py.typed），因此只在 CI 上触发 import-untyped；macOS 侧该 marker
    # 为假，本地装的是 mini-racer（带 py.typed）而不是它。
    # 已用「把无 py.typed 的包放进临时 venv 的 site-packages + --python-executable」
    # 在本地复现过该报错，确认需豁免。
    "py_mini_racer",
    "py_mini_racer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "allow_startup_watchlist_sync: exercise the production TUI startup sync scheduler",
]

[tool.coverage.report]
# 覆盖率门槛 85%。需为低覆盖模块（网络抓取 / 期货 / 指标计算等）
# 补单测以达到该标准。
fail_under = 85
