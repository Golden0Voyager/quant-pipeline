[project]
name = "quant-pipeline"
version = "0.1.0"
description = "A股量化数据自动化抓取管道"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"daily_pipeline.py" = ["E402"]
"reconcile_with_akshare.py" = ["E402"]
"__init__.py" = ["N999"]

[tool.coverage.report]
fail_under = 85