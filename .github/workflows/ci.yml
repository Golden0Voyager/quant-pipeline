name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上的新推送取消还在跑的旧 CI，避免排队浪费 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # 全量套件（含 TUI e2e）约 12 分钟；挂死时 30 分钟兜底，不让 runner 空转。
    timeout-minutes: 30
    # 最小权限：本工作流只读代码、发 PR 状态，默认 GITHUB_TOKEN 降为只读。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # 钉 commit SHA（# v3）：mutable tag 可被重指，属供应链攻击面
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TUI 端到端用例（tests/test_tui_tmux.py）驱动真 tmux 会话：不装的话它们会被
      # skipif 静默跳过——本仓库的 TUI e2e 从此在 CI 上真的跑，而不是只有本机才跑。
      - name: Install tmux
        run: sudo apt-get install -y --no-install-recommends tmux

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check

      # 不带文件参数：检查范围由 pyproject.toml 的 [tool.mypy] files 决定。
      # 此前的 `mypy . || true` 永远返回 0，等于没有门禁。
      - name: mypy
        run: uv run mypy

      - name: pytest --cov
        run: uv run pytest --cov

      - name: coverage report
        run: uv run coverage report
